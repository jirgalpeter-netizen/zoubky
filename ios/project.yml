name: Zoubky
options:
  bundleIdPrefix: cz.petr
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "3.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Zoubky:
    type: application
    platform: iOS
    sources:
      - path: Zoubky
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.petr.zoubky
        INFOPLIST_FILE: Zoubky/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Zoubky:
    build:
      targets:
        Zoubky: all
    archive:
      config: Release
