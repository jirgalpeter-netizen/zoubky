<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zoubky</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ===== Základ: plátno ve vysokém rozlišení (virtuální scéna 1600×720, poměr S21 20:9) =====
const VW = 1600, VH = 720;
const cvs = document.getElementById('c');
let ctx = cvs.getContext('2d');
let dpr = 1, S = 1, OX = 0, OY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 4);
  cvs.width = Math.round(innerWidth * dpr);
  cvs.height = Math.round(innerHeight * dpr);
  S = Math.min(cvs.width / VW, cvs.height / VH);
  OX = (cvs.width - VW * S) / 2;
  OY = (cvs.height - VH * S) / 2;
}
addEventListener('resize', resize);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const ease = t => { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function hex2rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')'; }
const lighten = (h, t) => mix(h, '#ffffff', t), darken = (h, t) => mix(h, '#000000', t);
function full() { return { x: -OX / S, y: -OY / S, w: cvs.width / S, h: cvs.height / S }; }

// ===== Uložení postupu =====
const Store = {
  get(k, d) { try { const v = localStorage.getItem('zoubky_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('zoubky_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stars = Store.get('stars', 0), stickers = Store.get('stickers', []), musicOn = Store.get('music', true);
function todayKey() { const d = new Date(); return 'clean_' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
let cleanedToday = Store.get(todayKey(), []);

// ===== Hlas (Android TTS přes most, v prohlížeči speechSynthesis) =====
let T = 0, lastSay = -99;
function say(text, queue) {
  lastSay = T;
  try {
    if (window.Android && window.Android.speak) { window.Android.speak(text, !!queue); return; }
    if (window.speechSynthesis) {
      if (!queue) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'cs-CZ'; u.rate = 0.95; u.pitch = 1.2;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
}
function buzz(ms) { try { if (window.Android && window.Android.vibrate) window.Android.vibrate(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ===== Zvuky (syntetizované, bez souborů) =====
const Snd = {
  ac: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.8; this.master.connect(this.ac.destination);
      this.musicG = this.ac.createGain(); this.musicG.gain.value = musicOn ? 0.12 : 0; this.musicG.connect(this.master);
      const len = this.ac.sampleRate * 2, b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
      const src = this.ac.createBufferSource(); src.buffer = b; src.loop = true;
      this.scrubF = this.ac.createBiquadFilter(); this.scrubF.type = 'bandpass'; this.scrubF.frequency.value = 3500; this.scrubF.Q.value = 0.9;
      this.scrubG = this.ac.createGain(); this.scrubG.gain.value = 0;
      src.connect(this.scrubF); this.scrubF.connect(this.scrubG); this.scrubG.connect(this.master); src.start();
    } catch (e) { this.ac = null; }
  },
  tone(f, d, o) {
    o = o || {}; const ac = this.ac; if (!ac) return;
    const t = ac.currentTime + (o.when || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    const v = o.vol == null ? 0.3 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.02, d / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(o.dest || this.master); osc.start(t); osc.stop(t + d + 0.05);
  },
  noise(d, o) {
    o = o || {}; const ac = this.ac; if (!ac) return;
    const t = ac.currentTime + (o.when || 0);
    const s = ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = ac.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + d);
    const g = ac.createGain(); g.gain.setValueAtTime(o.vol == null ? 0.3 : o.vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + d + 0.05);
  },
  pop() { this.tone(rnd(500, 700), 0.14, { to: 1500, vol: 0.35 }); },
  boing() { this.tone(rnd(260, 330), 0.22, { type: 'triangle', to: 130, vol: 0.22 }); },
  tap() { this.tone(660, 0.08, { vol: 0.2 }); this.tone(990, 0.1, { vol: 0.15, when: 0.05 }); },
  ding() { this.tone(1568, 0.3, { vol: 0.15 }); this.tone(2093, 0.4, { vol: 0.1, when: 0.08 }); },
  sparkle() { [1319, 1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.25, { vol: 0.12, when: i * 0.07 })); },
  squish() { this.noise(0.4, { f: 500, fto: 2200, vol: 0.25, ft: 'bandpass' }); this.tone(200, 0.3, { to: 520, vol: 0.15 }); },
  splash() { this.noise(1.2, { f: 3000, fto: 300, vol: 0.3 }); for (let i = 0; i < 8; i++) this.tone(rnd(300, 700), 0.1, { to: rnd(800, 1500), vol: 0.08, when: 0.3 + i * 0.09 }); },
  munch() { for (let i = 0; i < 4; i++) this.noise(0.09, { f: 1400, vol: 0.4, when: i * 0.2, ft: 'bandpass' }); },
  wrong() { this.tone(240, 0.18, { type: 'square', vol: 0.07 }); this.tone(180, 0.3, { type: 'square', vol: 0.07, when: 0.18 }); },
  fanfare() {
    const n = [523, 659, 784, 1047, 784, 1047], w = [0, 0.13, 0.26, 0.39, 0.6, 0.73];
    n.forEach((f, i) => { const d = i === 5 ? 0.7 : 0.18; this.tone(f, d, { type: 'triangle', vol: 0.22, when: w[i] }); this.tone(f * 2, d, { vol: 0.06, when: w[i] }); });
  },
  scrub(level) { if (!this.scrubG) return; const t = this.ac.currentTime; this.scrubG.gain.setTargetAtTime(level, t, 0.04); this.scrubF.frequency.setTargetAtTime(2500 + level * 9000, t, 0.05); }
};
const Music = {
  on: false, next: 0, step: 0,
  mel: [523, 659, 784, 659, 698, 880, 784, 0, 659, 784, 659, 523, 587, 659, 523, 0, 784, 880, 784, 659, 698, 784, 698, 587, 659, 698, 659, 523, 587, 523, 0, 0],
  bass: [131, 175, 196, 131, 165, 175, 196, 131],
  tick() {
    if (!this.on || !Snd.ac || !musicOn) return;
    const ac = Snd.ac;
    if (this.next < ac.currentTime) this.next = ac.currentTime + 0.05;
    while (this.next < ac.currentTime + 0.25) {
      const w = this.next - ac.currentTime, n = this.mel[this.step % this.mel.length];
      if (n) Snd.tone(n, 0.24, { type: 'triangle', vol: 0.5, when: w, dest: Snd.musicG });
      if (this.step % 2 === 0) Snd.tone(this.bass[Math.floor(this.step / 4) % this.bass.length], 0.35, { vol: 0.7, when: w, dest: Snd.musicG });
      this.step++; this.next += 0.26;
    }
  }
};
function setMusic(on) { musicOn = on; Store.set('music', on); if (Snd.musicG) Snd.musicG.gain.value = on ? 0.12 : 0; }

// ===== Částice =====
let parts = [];
function addPart(p) { parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, size: 10, rot: 0, vr: 0, color: '#fff', type: 'dot' }, p)); }
function burst(x, y, n, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(o.smin || 100, o.smax || 400);
    addPart({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.g || 0, life: rnd(0.6, 1.2) * (o.life || 1), size: rnd(o.min || 6, o.max || 14), color: pick(o.colors || ['#ffd700', '#ffffff', '#fff3a0']), type: o.type || 'star', rot: rnd(0, 6), vr: rnd(-6, 6) });
  }
}
const CONF = ['#ff4d6d', '#ffd23f', '#4cd964', '#3fa9f5', '#b06cff', '#ff9f1a', '#ffffff'];
function confetti(n) {
  for (let i = 0; i < (n || 70); i++) addPart({ x: rnd(0, VW), y: rnd(-80, -10), vx: rnd(-80, 80), vy: rnd(120, 360), g: 160, life: rnd(2.5, 4), size: rnd(14, 24), color: pick(CONF), type: 'confetti', rot: rnd(0, 6), vr: rnd(-8, 8) });
}
function updParts(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += p.vr * dt; p.life -= dt; if (p.type === 'confetti') p.vx += Math.sin(T * 3 + p.rot) * 30 * dt; }
  parts = parts.filter(p => p.life > 0);
}
function drawParts() {
  for (const p of parts) {
    ctx.save();
    ctx.globalAlpha = clamp(p.life / 0.4, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.type === 'star') { starPath(0, 0, p.size, p.size * 0.45, 5); ctx.fill(); }
    else if (p.type === 'confetti') { ctx.scale(1, Math.abs(Math.sin(p.rot * 2)) * 0.8 + 0.2); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
    else if (p.type === 'bubble') { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, 7); ctx.fillStyle = 'rgba(225,245,255,.55)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.5; ctx.stroke(); }
    else if (p.type === 'drop') { ctx.beginPath(); ctx.ellipse(0, 0, p.size * 0.6, p.size, 0, 0, 7); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(0, 0, p.size, 0, 7); ctx.fill(); }
    ctx.restore();
  }
}

// ===== Tvary =====
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function starPath(x, y, R, r, n) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R; i ? ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad) : ctx.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.75);
  ctx.bezierCurveTo(x - s * 1.25, y - s * 0.05, x - s * 0.6, y - s * 0.95, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 0.95, x + s * 1.25, y - s * 0.05, x, y + s * 0.75);
  ctx.closePath();
}
function cuteFace(x, y, s) {
  ctx.fillStyle = '#3a2416';
  ctx.beginPath(); ctx.arc(x - s * 0.32, y - s * 0.1, s * 0.11, 0, 7); ctx.arc(x + s * 0.32, y - s * 0.1, s * 0.11, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3a2416'; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y + s * 0.05, s * 0.25, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,110,130,.45)';
  ctx.beginPath(); ctx.arc(x - s * 0.55, y + s * 0.12, s * 0.12, 0, 7); ctx.arc(x + s * 0.55, y + s * 0.12, s * 0.12, 0, 7); ctx.fill();
}
function drawCrown(x, y, w) {
  const h = w * 0.55;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x - w / 2, y);
  ctx.lineTo(x - w / 2, y - h * 0.55); ctx.lineTo(x - w * 0.25, y - h * 0.2); ctx.lineTo(x, y - h);
  ctx.lineTo(x + w * 0.25, y - h * 0.2); ctx.lineTo(x + w / 2, y - h * 0.55); ctx.lineTo(x + w / 2, y); ctx.closePath();
  const g = ctx.createLinearGradient(0, y - h, 0, y); g.addColorStop(0, '#fff17a'); g.addColorStop(1, '#f5b400');
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = w * 0.04; ctx.strokeStyle = '#c98a00'; ctx.lineJoin = 'round'; ctx.stroke();
  const gem = [['#ff4d6d', -0.25], ['#3fa9f5', 0], ['#4cd964', 0.25]];
  for (const [c, dx] of gem) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + dx * w, y - h * 0.2, w * 0.06, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#fff'; for (const dx of [-0.5, 0, 0.5]) { ctx.beginPath(); ctx.arc(x + dx * w, y - (dx === 0 ? h : h * 0.55), w * 0.05, 0, 7); ctx.fill(); }
  ctx.restore();
}

// ===== Zvířátka =====
const ANIMALS = [
  { id: 'bobr', name: 'Bobík', dat: 'Bobíkovi', hello: 'Ahoj, já jsem bobr Bobík!', fur: '#8a5530', fur2: '#5e3519', muz: '#dcb88f', inner: '#5a3219', nose: '#2b1a10', ear: 'small', food: 'wood', teeth: 'beaver', whisk: true },
  { id: 'medved', name: 'Míša', dat: 'Míšovi', hello: 'Ahoj, já jsem medvídek Míša!', fur: '#bb7d3f', fur2: '#8a5526', muz: '#f3d6ad', inner: '#f3d6ad', nose: '#2a1c14', ear: 'big', food: 'honey', teeth: 'bear', whisk: false },
  { id: 'kocka', name: 'Micka', dat: 'Micce', hello: 'Ahoj, já jsem kočička Micka!', fur: '#f5a442', fur2: '#c97420', muz: '#fff4e2', inner: '#ffb3c1', nose: '#ff7f9f', ear: 'cat', food: 'fish', teeth: 'cat', whisk: true, stripes: true }
];
function blinkVal(seed) { const p = (T + seed * 1.37) % 4.2; return p > 4.02 ? Math.sin((p - 4.02) / 0.18 * Math.PI) : 0; }

function drawEars(a, cx, cy, R) {
  ctx.lineJoin = 'round';
  for (const s of [-1, 1]) {
    if (a.ear === 'cat') {
      ctx.fillStyle = a.fur; ctx.strokeStyle = a.fur2; ctx.lineWidth = R * 0.03;
      ctx.beginPath(); ctx.moveTo(cx + s * R * 0.18, cy - R * 0.78); ctx.lineTo(cx + s * R * 0.8, cy - R * 1.15); ctx.lineTo(cx + s * R * 0.88, cy - R * 0.38); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = a.inner;
      ctx.beginPath(); ctx.moveTo(cx + s * R * 0.36, cy - R * 0.74); ctx.lineTo(cx + s * R * 0.75, cy - R * 0.99); ctx.lineTo(cx + s * R * 0.79, cy - R * 0.53); ctx.closePath(); ctx.fill();
    } else {
      const big = a.ear === 'big', er = big ? R * 0.3 : R * 0.17;
      const ex = cx + s * R * (big ? 0.68 : 0.7), ey = cy - R * (big ? 0.7 : 0.7);
      ctx.fillStyle = a.fur; ctx.strokeStyle = a.fur2; ctx.lineWidth = R * 0.03;
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = a.inner; ctx.beginPath(); ctx.arc(ex + s * er * 0.05, ey + er * 0.08, er * 0.55, 0, 7); ctx.fill();
    }
  }
}
function drawEyes(a, cx, ey, R, st) {
  for (const s of [-1, 1]) {
    const ex = cx + s * R * 0.36;
    if (st.happy) {
      ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = R * 0.05; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, ey + R * 0.05, R * 0.11, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      continue;
    }
    const bl = st.blink || 0, h = Math.max(1, R * 0.16 * (1 - bl * 0.92));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, R * 0.14, h, 0, 0, 7); ctx.fill();
    ctx.lineWidth = R * 0.018; ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.stroke();
    if (bl < 0.6) {
      const px = ex + (st.lookX || 0) * R * 0.045, py = ey + (st.lookY || 0) * R * 0.05;
      ctx.save(); ctx.beginPath(); ctx.ellipse(ex, ey, R * 0.14, h, 0, 0, 7); ctx.clip();
      ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.arc(px, py, R * 0.095, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px + R * 0.03, py - R * 0.035, R * 0.032, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(px - R * 0.03, py + R * 0.03, R * 0.014, 0, 7); ctx.fill();
      ctx.restore();
    }
    if (st.sad) {
      ctx.strokeStyle = a.fur2; ctx.lineWidth = R * 0.04; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - s * R * 0.12, ey - R * 0.3); ctx.lineTo(ex + s * R * 0.12, ey - R * 0.21); ctx.stroke();
    }
  }
}
function drawNose(a, cx, ny, R) {
  ctx.fillStyle = a.nose; ctx.beginPath();
  if (a.id === 'kocka') {
    ctx.moveTo(cx - R * 0.09, ny - R * 0.04); ctx.quadraticCurveTo(cx, ny - R * 0.08, cx + R * 0.09, ny - R * 0.04);
    ctx.quadraticCurveTo(cx + R * 0.02, ny + R * 0.06, cx, ny + R * 0.06); ctx.quadraticCurveTo(cx - R * 0.02, ny + R * 0.06, cx - R * 0.09, ny - R * 0.04);
  } else { const w = a.id === 'medved' ? R * 0.16 : R * 0.14; ctx.ellipse(cx, ny, w, w * 0.66, 0, 0, 7); }
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(cx - R * 0.04, ny - R * 0.03, R * 0.04, R * 0.022, -0.3, 0, 7); ctx.fill();
}
function drawWhiskers(cx, ny, R) {
  ctx.strokeStyle = 'rgba(70,45,30,.55)'; ctx.lineWidth = R * 0.012; ctx.lineCap = 'round';
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(cx + s * R * 0.28, ny + R * (0.06 + i * 0.05));
    ctx.quadraticCurveTo(cx + s * R * 0.55, ny + R * (0.0 + i * 0.07), cx + s * R * 0.82, ny + R * (-0.04 + i * 0.1)); ctx.stroke();
  }
}
// pusa otevřená – cesta
function mouthPath(m) {
  const r = Math.min(m.h * 0.45, m.w * 0.2), rb = Math.min(m.h * 0.5, m.w * 0.28);
  ctx.beginPath(); ctx.moveTo(m.x + r, m.y); ctx.lineTo(m.x + m.w - r, m.y); ctx.quadraticCurveTo(m.x + m.w, m.y, m.x + m.w, m.y + r);
  ctx.lineTo(m.x + m.w, m.y + m.h - rb); ctx.quadraticCurveTo(m.x + m.w, m.y + m.h, m.x + m.w - rb, m.y + m.h);
  ctx.lineTo(m.x + rb, m.y + m.h); ctx.quadraticCurveTo(m.x, m.y + m.h, m.x, m.y + m.h - rb);
  ctx.lineTo(m.x, m.y + r); ctx.quadraticCurveTo(m.x, m.y, m.x + r, m.y); ctx.closePath();
}
// zuby
const TEETH = {

    this.a = ANIMALS[i]; this.ai = i; this.t = 0; this.q = -1; this.done = false; this.dur = 120;
    this.teeth = makeTeeth(this.a.teeth, this.a.food, 0); this.fullH = FR * 0.67; this.foam = [];
    Music.on = true; Music.step = 0;
    say('Čistíme zoubky spolu! Vezmi si svůj kartáček a čisti se mnou. Dvě minutky.');
  },
  mouthRect() { return { x: FCX - FR * 0.7, y: FCY - FR * 0.05, w: FR * 1.4, h: this.fullH }; },
  brushPos() {
    const m = this.mouthRect(), q = Math.max(0, this.q), left = q % 2 === 0, upper = q < 2;
    return { x: m.x + m.w * (left ? 0.28 : 0.72) + Math.sin(T * 10) * m.w * 0.14, y: upper ? m.y + m.h * 0.2 : m.y + m.h * 0.8 };
  },
  update(dt) {
    if (this.done) { Reward.update(dt); return; }
    this.t += dt;
    const tt = this.t - 5;
    if (tt < 0) return;
    const q = Math.min(3, Math.floor(tt / 30));
    if (q !== this.q) { this.q = q; say(QSAY[q]); Snd.sparkle(); buzz(60); }
    const p = this.brushPos();
    if (Math.random() < dt * 25) { this.foam.push({ x: p.x + rnd(-40, 40), y: p.y + rnd(-20, 20), r: rnd(8, 18), a: 1 }); if (this.foam.length > 120) this.foam.shift(); }
    if (tt >= this.dur) {
      this.done = true; Music.on = false; this.foam = [];
      const id = giveReward();
      Reward.start(id, [
        { x: 1290, y: 560, r: 62, color: '#ff9f1a', icon: 'again', delay: 0, fn: () => go('together') },
        { x: 1480, y: 560, r: 62, color: '#3fa9f5', icon: 'home', delay: 0.15, fn: () => go('home') }
      ]);
      say('Výborně! Vyčistil sis zoubky celé dvě minutky. Teď vypláchni pusu. Tady máš nálepku!');
    }
  },
  draw() {
    bgBath();
    const m = this.mouthRect(); layoutTeeth(this.teeth, m, this.fullH);
    const tt = this.t - 5, running = !this.done && tt >= 0;
    drawAnimal(this.a, FCX, FCY, FR, { mode: this.done ? 'grin' : 'open', mouth: m, teeth: this.teeth, blink: blinkVal(2), happy: this.done, hat: this.done,
      inside: () => { for (const f of this.foam) { ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); } } });
    if (running) { const p = this.brushPos(); drawBrush(p.x, p.y, 1.0, 1, 1); }
    if (!this.done) {
      // hodiny vlevo – ubývající koláč
      const cx = 200, cy = 330, r = 135, left = tt < 0 ? 1 : clamp(1 - tt / this.dur, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, 7); ctx.fill();
      const cols = ['#ff8fc7', '#ffd23f', '#5fd0ff', '#4cd964'];
      for (let i = 0; i < 4; i++) {
        const a0 = -Math.PI / 2 + i * Math.PI / 2, a1 = a0 + Math.PI / 2, aEnd = -Math.PI / 2 + (1 - left) * Math.PI * 2;
        if (aEnd >= a1) continue;
        ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, Math.max(a0, aEnd), a1); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; for (let i = 0; i < 4; i++) { const a = -Math.PI / 2 + i * Math.PI / 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke(); }
      drawToothChar(cx, cy, 42, T);
      if (tt < 0) { const n = Math.ceil(-tt); ctx.fillStyle = '#ff6fa8'; ctx.beginPath(); ctx.arc(cx, cy + 210, 46, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 60px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(n), cx, cy + 213); }
      // mapka pusy vpravo
      const mx = 1400, my = 330, w = 240, h = 170;
      ctx.fillStyle = 'rgba(255,255,255,.9)'; rr(mx - w / 2 - 16, my - h / 2 - 16, w + 32, h + 32, 40); ctx.fill();
      for (let i = 0; i < 4; i++) {
        const qx = mx - w / 2 + (i % 2) * w / 2, qy = my - h / 2 + Math.floor(i / 2) * h / 2;
        const cur = i === this.q, past = i < this.q;
        ctx.fillStyle = cur ? (Math.sin(T * 8) > 0 ? '#ffd23f' : '#ffe98a') : past ? '#4cd964' : '#e3f3fa';
        rr(qx + 4, qy + 4, w / 2 - 8, h / 2 - 8, 22); ctx.fill();
        ctx.fillStyle = '#fff'; for (let k = 0; k < 3; k++) { rr(qx + 18 + k * 34, i < 2 ? qy + 14 : qy + h / 2 - 52, 26, 38, 10); ctx.fill(); }
        if (past) { ctx.fillStyle = '#fff'; starPath(qx + w / 4, qy + h / 4, 20, 9, 5); ctx.fill(); }
      }
    }
    if (this.done) Reward.draw();
    this.hb = homeBtn(70, 70); this.hb.r = 44; if (!this.done) drawBtn(this.hb);
  },
  down(x, y) {
    if (this.done) { Reward.down(x, y); return; }
    if (dist(x, y, 70, 70) < 70) { Snd.tap(); go('home'); }
  }
};

// ===== Vstup =====
let ptrId = null;
function toV(e) { const r = cvs.getBoundingClientRect(); return { x: ((e.clientX - r.left) * (cvs.width / r.width) - OX) / S, y: ((e.clientY - r.top) * (cvs.height / r.height) - OY) / S }; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init();
  if (ptrId !== null) return;
  ptrId = e.pointerId; try { cvs.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toV(e), sc = Scenes[scene];
  // domeček vlevo nahoře ve scéně čištění
  if (scene === 'brush' && Scenes.brush.phase !== 'reward' && dist(p.x, p.y, 70, 70) < 70) { Snd.tap(); go('home'); return; }
  sc.down && sc.down(p.x, p.y);
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== ptrId) return; const sc = Scenes[scene];
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) { const p = toV(ev); sc.move && sc.move(p.x, p.y); }
});
function endPtr(e) { if (e.pointerId !== ptrId) return; ptrId = null; const sc = Scenes[scene]; sc.up && sc.up(); }
cvs.addEventListener('pointerup', endPtr);
cvs.addEventListener('pointercancel', endPtr);
document.addEventListener('contextmenu', e => e.preventDefault());

window.onBack = function () { if (scene === 'home') return false; go('home'); return true; };
window.onPauseApp = function () { Snd.scrub(0); try { if (Snd.ac) Snd.ac.suspend(); } catch (e) {} };
window.onResumeApp = function () { try { if (Snd.ac) Snd.ac.resume(); } catch (e) {} };
document.addEventListener('visibilitychange', () => { if (document.hidden) window.onPauseApp(); else window.onResumeApp(); });

// ===== Smyčka =====
let last = performance.now();
function loop(ts) {
  let dt = (ts - last) / 1000; last = ts; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  T += dt; sceneT += dt;
  try {
    Music.tick();
    Scenes[scene].update(dt);
    updParts(dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.setTransform(S, 0, 0, S, OX, OY);
    Scenes[scene].draw();
    drawParts();
    if (sceneT < 0.35) { const f = full(); ctx.fillStyle = 'rgba(255,255,255,' + (1 - sceneT / 0.35) + ')'; ctx.fillRect(f.x, f.y, f.w, f.h); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
go('home');
requestAnimationFrame(loop);
</script>
</body>
